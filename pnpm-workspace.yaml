packages:
  - "packages/*"

allowBuilds:
  "@google/genai": false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false

minimumReleaseAge: 10080

# Single source of truth for the shared dev toolchain. Packages reference these
# with "catalog:" so a bump lands in one place instead of drifting per package.
# Runtime dependencies stay pinned per package, since those ranges are part of
# each package's published contract.
catalog:
  "@types/node": ^25.9.8
  "@typescript-eslint/eslint-plugin": ^8.71.0
  "@typescript-eslint/parser": ^8.71.0
  dotenv: ^17.4.2
  eslint: ^10.9.1
  eslint-plugin-prettier: ^5.5.6
  prettier: ^3.9.9
  tsup: ^8.5.1
  typescript: ^6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3

overrides:
  '@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33': ^4.0.33
  '@hono/node-server@<1.19.15': ^1.19.15
  '@humanfs/node@<0.16.8': ^0.16.8
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': ^1.31.0
